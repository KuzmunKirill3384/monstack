services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/monitoring
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AGENT_COMMAND_SECRET: ${AGENT_COMMAND_SECRET:-dev-secret}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend

  agent:
    build: ./agent
    environment:
      SERVER_URL: http://backend:3000
      HOST_ID: a0000000-0000-0000-0000-000000000001
      HOST_TOKEN: local-dev-token
      AGENT_COMMAND_SECRET: ${AGENT_COMMAND_SECRET:-dev-secret}
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: {}
